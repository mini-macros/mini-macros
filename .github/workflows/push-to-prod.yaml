name: Push Main Branch Commit to Production
run-name: pushing main commit ${{ github.sha }} to production server
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout main Branch
        uses: actions/checkout@v6

      - name: Log into Github Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push GHCR Image
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/arm64
          tags: ghcr.io/${{ github.repository_owner }}/${{ secrets.PACKAGE_NAME }}:latest

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:cicd
          args: --accept-dns

      - name: Add Host to known_hosts on Runner
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: Deploy Update Package to Host
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh deploy@${{ secrets.HOST_NAME }} \
            "echo '$GHCR_TOKEN' | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin \
             && cd /srv && docker compose pull && docker compose up -d"
